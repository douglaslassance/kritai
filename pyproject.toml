[project]
name = "kritai"
version = "0.1.0"
description = "Krita plugin that runs FLUX.2 image generation locally with mflux or on fal.ai."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["kritai"]
